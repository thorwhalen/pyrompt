[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrompt"
version = "0.0.5"
description = "Manage, share, and search prompts and prompt templates, with multiple templating languages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "prompt-management",
    "prompt-engineering",
    "templates",
    "llm",
    "jinja2",
    "mustache",
]
authors = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["dol"]

[project.optional-dependencies]
ai = ["aix"]

[project.urls]
Documentation = "https://thorwhalen.github.io/pyrompt/"
Homepage = "https://github.com/thorwhalen/pyrompt"
Repository = "https://github.com/thorwhalen/pyrompt"
Issues = "https://github.com/thorwhalen/pyrompt/issues"
Changelog = "https://github.com/thorwhalen/pyrompt/blob/main/CHANGELOG.md"

[project.scripts]
pyrompt = "pyrompt.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["tests", "examples", "scrap"]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci.testing]
exclude_paths = ["pyrompt"]
